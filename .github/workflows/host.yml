name: Host regression
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pyocd==0.46.1
      - name: Build and test without hardware
        shell: pwsh
        run: |
          $env:WIRELINK_PYTHON = (Get-Command python).Source
          dotnet build WireLink.App/WireLink.App.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project WireLink.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tests/test_remote.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/*.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
